# Query-agent prompt templates — the routing spec the planner reasons from.
#
# The planner names ONE template for a question; that fixes the tool allowlist.
# `_guard_plan` drops any planned call whose tool is not in the named template's
# `tools`, then applies filter-value hygiene. No tool *selection* lives in code.
#
# Human-facing rationale + the question taxonomy: docs/query-agent-prompt-templates.md
#
# mode:  D = deterministic (composes with no LLM draft; the only templates the
#            QUERY_PLAN_TOOLS=0 degraded mode routes to well)
#        S = needs LLM synthesis over retrieved evidence
#        cov = coverage-sensitive: when the matched set is larger than what the
#              model read, the answer must say so and offer the count / a filter
#
# Every tool call is implicitly scoped to the caller's organization_id — there is
# no unscoped read. Counts, sums and date math are computed by the tools, never
# by the model.

fallback: T9_risk_exposure_review   # ambiguous / no clear fit routes here

templates:

  T1_portfolio_census:
    mode: D
    tools: [count_contracts, aggregate_contracts]
    cues:
      - "how many contracts do we have"
      - "break down the portfolio by type / status"
      - "count of NDAs / active contracts"
      - "how many of each status"
    scaffold: >
      A count or breakdown of the portfolio. Call count_contracts with the filter
      the question names; for a grouped breakdown call aggregate_contracts
      measure=count group_by=<lifecycle_status|contract_type|party>. No text tool.
      Report the total and the breakdown book exactly as the tool returns them;
      cite contract_id "portfolio".

  T2_filtered_roster:
    mode: D cov
    tools: [list_contracts, count_contracts]
    cues:
      - "list all active vendor agreements"
      - "which contracts are with <party>"
      - "show approved master services agreements"
    scaffold: >
      List the contracts matching structured criteria. Call list_contracts with
      every filter the question names, using the exact facet spelling. detail=full
      only when the matched set is small. Add count_contracts with the same filter
      if a count is also asked. If matched exceeds the rows returned, say
      "N match — showing the first K".

  T3_clause_presence:
    mode: D cov
    tools: [find_contracts, count_contracts]
    cues:
      - "which contracts require liability insurance"
      - "do any contracts have a non-compete"
      - "contracts that mention arbitration"
    scaffold: >
      "Which contracts contain / require / mention X." Call find_contracts with
      query = the key phrase only ("liability insurance", not the whole question).
      This scans every contract in scope — do not use search_clauses here. Add a
      structural filter if the question names one. The matched count is exact and
      authoritative; list contract names up to the cap plus "and N more".

  T4_financial_rollup:
    mode: D
    tools: [aggregate_contracts, list_contracts]
    cues:
      - "total value of active contracts"
      - "average contract value by type"
      - "how much do we pay <party>"
      - "contracts worth over $1M"
    scaffold: >
      Value math. Call aggregate_contracts with the measure
      (sum_value|avg_value|min_value|max_value), optional group_by, and the
      filter. The tool does all arithmetic and currency handling — never add,
      average or convert values yourself. For "worth over $X" call list_contracts
      min_value=X. If value data is missing, say so plainly.

  T5_expiring_and_renewals:
    mode: D
    tools: [list_contracts, find_contracts, search_clauses]
    cues:
      - "which contracts expire in the next quarter"
      - "what renews automatically this year"
      - "contracts signed in 2024"
      - "up for renewal soon"
    scaffold: >
      Temporal question. Call list_contracts with expiring_within_days (pass the
      window in days — never compute a date) or effective_year. Only if the
      question also asks what notice or action is required, add
      search_clauses("renewal notice period") over the matched set. Convey the
      matched count.

  T6_clause_detail:
    mode: S
    tools: [list_contracts, search_clauses]
    cues:
      - "what does the indemnity clause in the <name> MSA say"
      - "explain the termination terms for <contract>"
      - "the liability cap in our largest deal"
    scaffold: >
      Explain a specific clause for one or a few contracts. If a contract is named
      but its id is unknown, call list_contracts to resolve it, then
      search_clauses(query=<clause topic>) scoped to it. Quote or paraphrase only
      what the evidence contains; if the clause is not present, say "not stated in
      <contract>". Bounded by construction — low coverage risk.

  T7_cross_contract_synthesis:
    mode: S cov
    tools: [find_contracts, search_clauses]
    cues:
      - "what payment obligations do we have across all contracts"
      - "our indemnification exposure across the portfolio"
      - "how is liability limited across our contracts"
    scaffold: >
      "What are our X across the portfolio." Call find_contracts(query=<topic
      phrase>) for the full matched set and search_clauses(query=<the question>)
      for the top-K clause evidence. Build the trigger -> consequence ->
      what-matters model from the evidence, then synthesise. You are reading a
      sample, not every contract — state that.
    coverage: >
      "Based on the N most relevant clauses across M matching contracts — ask
      about a specific contract or request the full list."

  T8_comparative_review:
    mode: S cov
    tools: [list_contracts, search_clauses]
    cues:
      - "how does the <name> deal compare to our other vendor agreements"
      - "are our NDAs consistent"
      - "which contracts have the most unfavourable <dimension>"
    scaffold: >
      Compare a contract to a cohort, or check consistency across one. Call
      list_contracts for the cohort and search_clauses for the clauses in
      question across it. Report the shared pattern and name the outliers. State
      how many of the cohort you actually examined.

  T9_risk_exposure_review:
    mode: S cov
    tools: [find_contracts, list_contracts, search_clauses]
    cues:
      - "what are the biggest contractual risks in our portfolio"
      - "where are we most exposed"
      - "what should I be worried about"
      - (also the fallback for any question that fits no other template)
    scaffold: >
      Open-ended risk / exposure. Decompose into concrete probes: call
      find_contracts separately for "indemnification", "limitation of liability",
      "termination for convenience" and "auto-renewal"; call list_contracts
      expiring_within_days=90; call search_clauses for the highest-signal clauses.
      Build what_matters (near deadlines, unilateral termination, auto-renew
      lock-in, uncapped liability, penalties) with a one-line why and a severity
      each. Never assert a risk without a cited clause.
    coverage: >
      "Reviewed <these dimensions> across N contracts — a first pass, not
      exhaustive."

  T10_obligation_tracker:
    mode: D
    tools: [list_contracts, find_contracts]
    cues:
      - "what do we owe and when"
      - "obligations due in the next 90 days"
      - "our reporting obligations"
    scaffold: >
      "What do we owe / what is due." Call list_contracts detail=full to read
      obligations with their due dates, or find_contracts on obligation text for a
      topic ("reporting", "payment"). Date-bound where the question implies it.
      List obligation -> responsible party -> due date; never invent a date.

  T11_counterparty_profile:
    mode: D
    tools: [list_contracts, count_contracts, aggregate_contracts]
    cues:
      - "everything we have with <party>"
      - "top counterparties by contract count / value"
      - "who have we signed the most deals with"
    scaffold: >
      Party-centric. For "everything with <party>" call list_contracts
      party=<name>. For rankings call aggregate_contracts group_by=party (measure
      count or sum_value). Report per-party figures exactly as the tool returns.

  T12_out_of_scope:
    mode: D
    tools: []
    cues:
      - "should we renew the <name> contract"
      - "is this clause market-standard"
      - "what happens if we breach"
    scaffold: >
      The question asks for legal advice, a market comparison, a prediction or a
      recommendation. Call no tools. Respond that you can report what the
      contracts state, not whether the user should act, what is market-standard,
      or what a court would do. Offer the in-scope version of the question if
      there is one.
