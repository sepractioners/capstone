[project]
name = "extraction-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dep:llm",
    "dep:config",
    "langgraph",
    "llama-index-core",
    "llama-index-readers-file",
    "mcp>=1.29,<2",
    "pydantic>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["extraction_agent*", "query_agent*", "agent_trace*", "agent_llm*"]

[tool.setuptools.package-data]
extraction_agent = ["*.yaml", "profiles/*.yaml"]
query_agent = ["prompts/*.yaml"]

[project.optional-dependencies]
rag = ["dep:rag"]
