[project]
name = "clm-mcp-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "contract-lifecycle",
    "extraction-agent",
    "mcp>=1.29,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clm_mcp_core*", "clm_mcp_server*", "extraction_mcp_server*", "query_mcp_server*"]
