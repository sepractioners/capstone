[project]
name = "clm-web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "contract-lifecycle",
    "clm-mcp-server",
    "extraction-agent",
    "dep:llm",
    "fastapi>=0.115",
    "hypercorn>=0.17",
    "PyJWT>=2.9",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clm_web*"]
