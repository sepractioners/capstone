[project]
name = "capstone-setup"
version = "0.1.0"
description = "Capstone project setup orchestrator"
requires-python = ">=3.11"
dependencies = [
    "tomli>=0.1; python_version < '3.11'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
capstone-setup = "tools.setup.main:main"
