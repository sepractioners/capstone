[project]
name = "clm-platform-testing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dep:llm",
    "dep:config",
    "clm-web",
    "extraction-agent",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_testing*"]

[tool.setuptools.package-data]
platform_testing = ["prompts/*.yaml", "scenarios/*.yaml", "fixtures/*.jsonl"]
